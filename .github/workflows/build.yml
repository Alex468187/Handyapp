name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Dateien erzeugen
        run: bash tool/prepare.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Fester Signatur-Schlüssel (damit Updates drüber installiert werden)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          echo "$DEBUG_KEYSTORE" | base64 -di > "$RUNNER_TEMP/summer.keystore"
          keytool -list -keystore "$RUNNER_TEMP/summer.keystore" -storepass android -alias androiddebugkey
          echo "SUMMER_KEYSTORE=$RUNNER_TEMP/summer.keystore" >> "$GITHUB_ENV"
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk Summer.apk
      - name: Signatur prüfen (muss immer gleich sein, sonst gehen Updates nicht)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Summer.apk | tee certs.txt
          grep -qi "SHA-256 digest: 24b26996f3794db318140780d4a676594f53f7079ba79b6a950ed26cff529e7d" certs.txt
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: Summer.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Dateien erzeugen
        shell: bash
        run: bash tool/prepare.sh
      - run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - name: Zippen
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Summer-Windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: Summer-Windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: >
          gh release create "build-${{ github.run_number }}"
          Summer.apk Summer-Windows.zip
          --repo "${{ github.repository }}"
          --title "Build ${{ github.run_number }}"
          --notes "$NOTES"
          --latest
