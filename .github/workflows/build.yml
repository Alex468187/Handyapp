name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Dateien erzeugen
        run: bash tool/prepare.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Fester Signatur-Schlüssel (damit Updates drüber installiert werden)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -di > ~/.android/debug.keystore
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk Summer.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: Summer.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Dateien erzeugen
        shell: bash
        run: bash tool/prepare.sh
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Zippen
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Summer-Windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: Summer-Windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: >
          gh release create "build-${{ github.run_number }}"
          Summer.apk Summer-Windows.zip
          --repo "${{ github.repository }}"
          --title "Build ${{ github.run_number }}"
          --notes "$NOTES"
          --latest
