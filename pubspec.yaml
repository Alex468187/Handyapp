name: handyapp
description: Persönliche Manager-App (To-dos, Kalender, Notizen, Passwörter).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.0
  table_calendar: ^3.1.0
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  quick_actions: ^1.1.0
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
